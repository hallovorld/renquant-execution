[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "renquant-execution"
version = "0.1.0"
description = "Broker execution workflows for RenQuant."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["renquant-common>=0.1.0"]

[project.optional-dependencies]
alpaca = ["alpaca-py>=0.30"]
preopen = [
    "alpaca-py>=0.30",
    "pandas>=2",
    "pandas-market-calendars>=4",
    "yfinance>=0.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "scripts", "../renquant-common/src"]
testpaths = ["tests"]
