name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: renquant-execution
      - uses: actions/checkout@v4
        with:
          repository: hallovorld/renquant-common
          path: renquant-common
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install test tools
        # Install the declared `alpaca` extra so the broker-adapter tests can
        # construct/assert real MarketOrderRequest/OrderSide/TimeInForce shapes
        # (place_order/place_stop_order/get_orders import alpaca lazily).
        run: python -m pip install pytest -e renquant-common -e "./renquant-execution[alpaca]"
      - name: Test
        working-directory: renquant-execution
        run: make test
